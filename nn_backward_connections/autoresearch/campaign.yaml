# Autonomous research campaign — configuration (Phase 7)
#
# This file is the ONLY place campaign-level knobs live. The cycle command, the driver and
# the audit script all read it. Editing it changes the campaign; editing anything else to
# change a threshold is a protocol violation.
#
# Governance: autoresearch/CAMPAIGN.md (constitution) + experiments/PROTOCOL.md (§ Phase-7).

campaign:
  name: phase7-autonomous
  branch: auto/campaign-v3
  # The sandbox branch. Any branch matching auto/campaign* is a campaign sandbox
  # (CLAUDE.md); THIS name is the one the current run must be on. v3 was cut from
  # generator/phase0 on 2026-08-25, which strictly contains auto/campaign (df36ef1)
  # plus the five launch fixes -- see experiments/log.md.
  sandbox_root: D:/1/bot/UHaifa/deep_learning/mfas_autoresearch
  # Everything below this path is writable by the campaign. Nothing above it ever is.
  repo_subdir: nn_backward_connections

# ─────────────────────────────────────────────────────────────────────────────
# Objective — ordered phases. Phase 2 does not start until Phase 1 exits.
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - id: quality
    active: true
    goal: >
      Push the exact feedforward % on the fly connectome from the current champion (83.9101%,
      H35) to at least the known-reachable reference 84.6147%, then beyond it, without
      regressing microns or mouse. Runtime is a CONSTRAINT here, not an objective.
    exit_criteria:
      # ALL must hold, verified by the verifier + critic + autoresearch/audit.py.
      - "connectome champion >= 84.6147 pct (CONFIRM stage, 95% CI lower bound > 0 vs prior champion)"
      - "microns champion non-regressing vs its current champion (CI lower bound > -0.002 pp)"
      - "mouse non-inferior (CI lower bound > -0.26 pp)"
      - "champion reproduces from a clean checkout on >= 5 seeds"
      - "autoresearch/audit.py returns exit code 0 on the champion's evidence"
  - id: speed
    active: false
    goal: >
      At the quality level fixed by Phase 1 (no score regression beyond its noise floor),
      minimize wall-clock per run. Headline metric becomes the (score, wall_clock) Pareto front
      plus score@60s / score@300s anytime curves.
    exit_criteria:
      - "connectome: same champion score within noise at <= 0.5x the Phase-1 champion wall-clock"
      - "anytime curves logged for the champion and the prior champion on all three datasets"

# ─────────────────────────────────────────────────────────────────────────────
# Hard runtime constraint (Phase 1). A variant that cannot produce a scored run within
# this wall-clock per (dataset, seed) is out of scope — it is not a usable algorithm.
# ─────────────────────────────────────────────────────────────────────────────
runtime:
  max_wall_clock_s_per_run: 3600      # user-set: "quality first, but within about an hour"
  # Soft warning band — the cycle should flag (not kill) a variant crossing this.
  # Raised 1200 -> 3400 at the P01 re-baseline: the CHAMPION itself now takes 3214 s on microns
  # (706 s on MPS, 4.55x), so a 1200 s band would fire on every single microns run and train the
  # cycle to ignore the warning. At 3400 it means what it is supposed to mean: this run is
  # approaching the 3600 s hard cap. Connectome runs (591 s) are nowhere near either number.
  warn_wall_clock_s_per_run: 3400
  # Only ONE heavy training/refinement process at a time: single GPU (RTX 4060, 8 GB).
  max_concurrent_heavy_runs: 1

  # ── The guard that makes the cap above real (P05, 2026-08-11) ──────────────────────
  # Until this landed the cap was an ASPIRATION: sweep.sh passes no --time-limit, so every
  # variant received time_limit=None and every internal wall-clock check (rocket per epoch,
  # sift per sweep, stage-4 per alternation cycle) was a dead branch. A run had no upper
  # bound at all. That was survivable at H36's 3314 s; H42 spends the margin (microns
  # 3398-3418 s, 5.1% under the cap), so the next slow machine overruns instead of degrading.
  #
  # eval/runtime_guard.py hands variant.run() a deadline of
  #     max_wall_clock_s_per_run - reserve_s
  # whenever the caller passes no explicit --time-limit.
  #
  # It is an ABORT, never a SIZING rule: the cycle counts stay fixed constants, so on an
  # idle machine the deadline is never reached and every confirmed number reproduces
  # bit-for-bit. A time-DERIVED cycle count would have destroyed exactly that (see H42).
  guard:
    enabled: true
    # reserve_s covers the three things the deadline cannot see, all measured in
    # experiments/outputs/proto_P05.json (2026-08-11):
    #   1. prologue  — greedy-FAS + init tensor, BEFORE run_rocket starts its clock:
    #                  microns 35.9 s, connectome 20.5 s, mouse 0.1 s
    #   2. epilogue  — the runner's frozen re-score + np.save, AFTER run() returns: <0.2 s
    #   3. abort granularity — a stage only sees the deadline at its own boundary, so a run
    #                  may overshoot by one stage-3 sweep plus one stage-4 cycle
    # 150 s covers all three on every dataset: deadline 3450 s, worst case
    # 3450 + 36 + ~60 + ~18 = ~3564 s, inside the 3600 s cap.
    #
    # HONEST COST, stated because it is thin: microns' variant-internal time is 3382 s
    # against the 3450 s deadline — 68 s, i.e. 2.0% of slack. A machine >2% slower than
    # this one trips the guard on microns and produces a TRUNCATED run: valid (stage 4 is
    # monotone and best-by-oracle) but lower-scoring and not comparable. Such runs are
    # flagged `degraded` in the record and by audit.py's runtime_guard check, so they can
    # never be pooled into a mean unnoticed. Widening the 2% needs microns to get cheaper
    # (Phase 2 / S01), not a different guard.
    reserve_s:
      default: 150

# ─────────────────────────────────────────────────────────────────────────────
# Datasets — character and per-dataset gates. Extends PROTOCOL.md § Phase-5.
# ─────────────────────────────────────────────────────────────────────────────
datasets:
  connectome:
    role: primary
    n_nodes: 136648
    baseline_sigma_pp: 0.0189         # frozen-baseline noise floor (PROTOCOL.md)
    # Smallest score difference the ORACLE can represent, expressed in pp. Connectome weights
    # are int64, total 41,912,141, so one weight unit = 100/41912141 = 2.386e-6 pp. Used as the
    # sigma FLOOR of the non-inferiority SE (audit.noninferiority_ci) — see D4 note below.
    measurement_resolution_pp: 0.0000024
    # Minimum effect size a promotion must clear (update_sota.py). Defaults to screen_delta_pp
    # when absent; stated explicitly here so the promotion gate never silently inherits a
    # screen-stage number that later changes for screen-stage reasons.
    min_promotion_delta_pp: 0.012
    # KEPT at the MPS-era value, but its JUSTIFICATION changed at the P01 re-baseline.
    # It used to be 2 x champion sigma (H35 sigma = 0.0060 on MPS). On CUDA the champion's sigma
    # is exactly 0.0000 — the pipeline never draws from `seed` — so "2 x sigma" would be 0 and
    # would wave through a +0.0001 pp difference. Read this now as a MINIMUM EFFECT SIZE: a gain
    # smaller than this is not worth a champion change, whatever its CI says. It is 1.7% of the
    # 0.70 pp mission gap, so it does not stand in the way of a real result.
    screen_delta_pp: 0.012
    confirm_seeds: [42, 123, 999, 7, 31415]
    screen_seeds: [42, 123, 999]
  microns:
    role: primary
    n_nodes: 67534
    baseline_sigma_pp: 0.0006
    # Same re-justification as connectome: champion sigma is 0.0000 here, so this is a minimum
    # effect size, not 2 x sigma. Note microns is the expensive dataset on this hardware
    # (3240 s/run vs 706 s on MPS) — see runtime above and queue item P02.
    screen_delta_pp: 0.002
    # int64 weights, total 15,400,557 -> one weight unit = 100/15400557 = 6.493e-6 pp.
    measurement_resolution_pp: 0.0000065
    min_promotion_delta_pp: 0.002
    confirm_seeds: [42, 123, 999, 7, 31415]
    screen_seeds: [42, 123, 999]
  mouse:
    role: supporting                  # non-inferiority only; tiny and 14x noisier
    n_nodes: 148
    baseline_sigma_pp: 0.2624
    non_inferiority_pp: -0.26
    # Mouse weights are float64 (total 9.159036176272162), so there is no integer quantum. The
    # resolution here is the float64 accumulation noise of the exact scorer: ulp(9.159) = 1.78e-15
    # absolute, i.e. ~2e-14 pp per ulp, and the measured cancellation noise of numpy's ddof=1 std
    # over 20 identical values is 1.458e-14 pp. 1e-12 pp sits two orders above that and eleven
    # orders below the -0.26 pp non-inferiority margin, so it floors float noise without ever
    # being the binding term of a real comparison.
    measurement_resolution_pp: 0.000000000001
    # JUDGEMENT CALL, flagged for the operator (2026-08-15). Mouse is SUPPORTING and PROTOCOL.md
    # calls it saturated with an expectation of 0.0000 pp, so it has no screen_delta_pp to inherit.
    # Before this existed, the only floor on a mouse promotion was update_sota.py's 4-decimal
    # rounding of pct_mean, which is how H42 took the mouse championship from H36 on a delta of
    # EXACTLY 0.0 over bit-identical pools (n=20 each, one distinct value, 92.91701410211007).
    # 0.01 pp = 3.8% of baseline_sigma_pp (0.2624) and ~2/3 of the smallest real mouse move ever
    # recorded between champions (+0.0152 pp, H30 -> H36). It excludes exact ties and float-level
    # differences without blocking a genuine mouse improvement. It is not derived from a
    # measurement; if you disagree with it, this line is the only place to change it.
    min_promotion_delta_pp: 0.01
    confirm_seeds: [42, 123, 999, 7, 31415, 2718, 1618, 1414, 1732, 2236,
                    9999, 8888, 7777, 6666, 5555, 4444, 3333, 2222, 1111, 1234]
    screen_seeds: [42, 123, 999]

# ─────────────────────────────────────────────────────────────────────────────
# Seed policy — how many screen seeds a variant actually needs (P02, 2026-08-09).
# Full rationale and the four safety constraints: PROTOCOL.md § Phase-7.4.
#
# The champion pipelines take a `seed` and never draw from it (init_positions comes from
# deterministic greedy-FAS, so make_init_positions is never reached), and this device reproduces
# a repeated seed bit-identically. For such a variant, screening at 42/123/999 runs the same
# computation three times — 108 min of pure waste per microns screen.
# ─────────────────────────────────────────────────────────────────────────────
seed_policy:
  enabled: true
  # The classifier is the authority. Static call-graph walk from the variant's run();
  # fail-safe (unresolvable call -> "rng"); pinned by tests/test_seed_class.py.
  classifier: autoresearch/seed_class.py
  classification_cache: autoresearch/seed_class.json   # regenerate: --all --out <this>
  screen_seeds_by_class:
    deterministic:
      # Primaries drop to one seed; mouse never does — see standing_tripwire below.
      connectome: [42]
      microns: [42]
      mouse: [42, 123, 999]
    rng:
      connectome: [42, 123, 999]
      microns: [42, 123, 999]
      mouse: [42, 123, 999]
  # Mouse costs ~6 s/run, so 3 seeds there are free and act as the corroborating probe.
  # If they are NOT identical for a variant the classifier called deterministic, the
  # classification is falsified: the 1-seed primary numbers are VOID and the variant is
  # re-screened at 3 seeds. The probe may escalate; it may never de-escalate.
  standing_tripwire: mouse_3_seeds_must_agree_for_deterministic
  # Confirm is deliberately untouched. Re-running a deterministic variant at 5 seeds is not
  # information-free: it re-establishes DEVICE repeatability, the only variance source left.
  # It is also what guarantees no CI in a promotion path is computed on a 1-seed pool, where
  # audit.protocol_se() (comparator-only, sqrt(2/n_c)) would understate the SE by ~41%.
  confirm_seeds_unchanged: true
  # Device determinism is a PRECONDITION and a property of the hardware, not the code.
  # Re-establish it on every port: autoresearch/PORTING.md § 6b. If it fails -> stay at 3 seeds.
  device_determinism_verified:
    # Same seed, fresh process, hours apart: position vectors compared bit-for-bit, 0 entries
    # differing. This is a property of the DEVICE and must be re-established on every port.
    connectome: true      # H35 s42 implement vs verify, bit-identical (P02)
    microns: true         # H30 s42 implement vs verify, bit-identical (P02)
    evidence: experiments/outputs/proto_P02_primaries.json

# ─────────────────────────────────────────────────────────────────────────────
# Comparator policy — Phase-7 change vs Phase 3-6.
# Variants are now judged against the CURRENT CHAMPION (autoresearch/sota.json), not the
# original random-init baseline. Beating a superseded baseline is not progress.
# ─────────────────────────────────────────────────────────────────────────────
comparator:
  primary: champion                   # per-dataset, from autoresearch/sota.json
  also_report: [baseline_passthrough, H02]   # kept for continuity with findings.md
  budget_basis: total_grad_steps      # unchanged; wall_clock_s logged alongside

# ─────────────────────────────────────────────────────────────────────────────
# The cheap-first gate ladder. A hypothesis climbs; it never skips a rung.
# This is what kept Phase 6 cheap (H32/H33/H34 died on rung 1 for ~0 large-graph compute).
# ─────────────────────────────────────────────────────────────────────────────
gates:
  - id: novelty
    what: >
      Is the mechanism materially distinct from every entry in autoresearch/killed.json?
      If it shares an axis with a killed entry, the proposal MUST state which revival
      condition it satisfies. No revival condition -> drop without spending compute.
  - id: prototype
    what: >
      Cheap proxies only (mouse + gap.make_hard_synthetic_graph + optionally an SCC subgraph).
      Must beat the champion pipeline's proxy score, or show a mechanism-specific signal that
      the proxy is known to under-represent. Budget: minutes, CPU.
  - id: screen
    what: >
      Real harness, role=implement, 3 datasets, vs champion. Seed count per dataset comes from
      seed_policy below, NOT from a fixed 3: run `python autoresearch/seed_class.py --variant
      <id>` first and record the verdict in the log entry.
      Pass iff delta > screen_delta_pp on BOTH primaries and mouse non-inferior.
  - id: confirm
    what: >
      Independent re-run by the verifier: confirm_seeds per dataset, role=confirm.
      Pass iff Welch 95% CI lower bound > 0 on BOTH primaries and mouse non-inferior.
      ON THIS MACHINE THE WELCH CI IS NOT SUFFICIENT ON ITS OWN. These pipelines take a
      seed but never draw from it (init_positions comes from deterministic greedy-FAS), so
      seed spread only ever measured device non-determinism; CUDA reproduces bit-identically
      and std collapses to 0, which makes SE 0 and any positive delta "significant". Use the
      PROTOCOL CI lower bound (audit.py floors its sigma at baseline_sigma_pp) AND require
      delta > screen_delta_pp. Verified in P01, 2026-08-09; see experiments/log.md.
  - id: critic
    what: >
      Red-team + mechanical audit (autoresearch/audit.py). Leakage, frozen integrity,
      fabricated numbers, cherry-picked seeds, double-counted increments, runtime honesty.

# ─────────────────────────────────────────────────────────────────────────────
# PROMOTION GATE (D1/D4/D5/D6, 2026-08-15) — the arithmetic that must hold before a variant
# may become the recorded champion. `audit.py --gate promotion` enforces every line of this
# block as a hard FAIL; `audit.py --gate report` (the default, and what every exploratory
# caller gets) reports the same computations at INFO/WARN and never changes its exit code.
#
# WHY THIS EXISTS. Until now audit.py could not FAIL on any SCIENTIFIC ground: every
# significance result was emitted at INFO and the degeneracy notice at WARN, so "is this a real
# gain?" was adjudicated only by the agent that produced the gain. `screen_delta_pp` above was
# read by NO code at all — it lived in a WARN message string and in prose. These are the
# thresholds that turn the ladder in `gates:` into something a script can refuse.
# ─────────────────────────────────────────────────────────────────────────────
promotion_gate:
  enabled: true
  z: 1.96                             # two-sided 95%, matching PROTOCOL.md throughout
  # Below this, a sample std is float noise rather than dispersion (D3): numpy's ddof=1 std over
  # 20 IDENTICAL mouse values returns 1.458e-14 by catastrophic cancellation, which defeated the
  # `std == 0.0` degeneracy tripwire on exactly the pool that needed it. audit.summarize() also
  # reports a single-distinct-value pool as exactly 0.0 so the record is not polluted.
  zero_std_tol: 0.000000000001
  primary:
    # PRIMARY datasets (connectome, microns): a promotion must show a real effect, twice over.
    require_delta_gt_min_effect: true       # delta_pp > datasets.<ds>.min_promotion_delta_pp
    require_protocol_ci_lower_gt: 0.0       # the sigma-floored CI of gates.confirm, now enforced

    # ── P09 (2026-08-25). An ADDITIONAL requirement when the pools are degenerate. ────────
    #
    # READ THIS BEFORE CHANGING require_protocol_ci_lower_gt ABOVE. On 2026-08-17 the campaign's
    # two connectome criteria disagreed for the first time: H52 scored +0.02093 pp, clearing
    # min_promotion_delta_pp (0.012) and failing the PROTOCOL CI (0.02343 pp at n=5). Queue item
    # P09 put three options to the OPERATOR and said, in terms, that the decision is the
    # operator's rather than the agent's. Cycle 9 measured the question properly and then chose,
    # unaided, the one option of the three that admits the campaign's own held result. Its critic
    # refused that, and the change was SPLIT:
    #
    #   * THE TIGHTENING - the relabelling requirement below - is IN FORCE. It can only ever
    #     refuse a promotion, so the campaign is free to impose it on itself.
    #   * THE RETIREMENT of require_protocol_ci_lower_gt for degenerate pools - the half that
    #     would ADMIT a result the campaign already holds - is NOT. It waits for the operator.
    #
    # So both gates run today and a degenerate-pool promotion must clear BOTH. H52's connectome
    # leg accordingly remains refused, and the campaign's gate is strictly stronger than it was
    # on 2026-08-17. See experiments/log.md 2026-08-25 for the operator's decision packet.
    #
    # WHAT WAS MEASURED, so the operator decides on evidence (4.2 h GPU, 5 paired points,
    # experiments/outputs/proto_P09_connectome.json):
    #   * Relabelling node indices yields an ISOMORPHIC graph - verified, not asserted: the
    #     parity anchor re-scores to exactly 34,751,902 under every permutation used. Nothing an
    #     algorithm ought to do changes; index-order tie-breaks do.
    #   * The champion H42's own connectome score moves over 84.11418066 - 84.15550043 across
    #     five labellings: sigma 0.019124 pp, span 0.0413 pp. One labelling (r=3) beats the
    #     canonical figure the campaign has quoted since 2026-08-10.
    #   * That measured sigma is within 1.2% of the fossil baseline_sigma_pp = 0.0189, so the
    #     constant's MAGNITUDE was well calibrated. What is wrong with the PROTOCOL CI is its
    #     APPLICATION: it applies a MARGINAL dispersion UNPAIRED to a difference of two arms that
    #     share the nuisance almost exactly, then divides by sqrt(n_comparator) over a pool of
    #     five identical reruns. The PAIRED delta sigma is 0.002011 pp - 9.5x tighter.
    #   * Taken in its own unpaired frame the old rule is not merely conservative but incoherent:
    #     the five confirm seeds are one sample repeated five times (P02), so effective n = 1 and
    #     the self-consistent unpaired threshold would be 1.96*0.019124*sqrt(2) = 0.053 pp, more
    #     than double what was actually applied.
    # These are the operator's inputs. The campaign is not acting on them.
    degenerate_pool_rule:
      enabled: true
      kind: relabelling_robustness         # autoresearch/relabel_gate.py
      # Applies only when BOTH pools are degenerate (std <= zero_std_tol). A stochastic pipeline
      # is untouched: it keeps require_protocol_ci_lower_gt and this rule is not consulted.
      #
      # TWO tests, both required, because each covers the other's defect:
      #   1. min-rule: every delta_r > min_promotion_delta_pp. Monotone in the safe direction -
      #      adding relabellings can only make it harder - but STOPPING-RULE SENSITIVE, since
      #      P(some labelling falls below the bar) grows with R (~1.5% at R=4, ~25% at R=99 for
      #      the observed dispersion), which rewards stopping at the floor.
      #   2. paired one-sided 95% lower bound on the mean delta > min_promotion_delta_pp.
      #      CONSISTENT: unlike a CI against ZERO, a CI against a FIXED non-zero effect size does
      #      not relax as R grows - it converges on "the true mean delta exceeds 0.012". Cycle 9
      #      first rejected any CI here by conflating those two cases; the critic corrected it.
      # min_relabellings is a FLOOR, not an exact count. Fix R in each study's pre-registration.
      min_relabellings: 4
      evidence_index: experiments/outputs/relabel_index.json
      generator: experiments/proto_P09_relabel.py
      prereg: experiments/outputs/proto_P09_prereg.json
      # KNOWN DEBT, stated rather than discovered later: the sitting champions predate this rule
      # and have no studies, so re-auditing H36/H42 under --gate promotion FAILS here. That is a
      # real gap in the record, not a bug. Cost to close: ~4.2 h per connectome pair, ~9.4 h per
      # microns pair. Filed with P08/P10.
  supporting:
    # SUPPORTING datasets (mouse): non-inferiority only, against datasets.<ds>.non_inferiority_pp.
    #
    # D4 (2026-08-15). The OLD bound reused audit.protocol_se(), i.e.
    #     max(std_comparator, baseline_sigma_pp) * sqrt(2 / n_comparator)
    # which is wrong here in two independent ways. (a) It uses the COMPARATOR's n, so the
    # variant's 20 mouse seeds contributed nothing — H36 was judged on sqrt(2/3). (b) Its sigma
    # floor is baseline_sigma_pp = 0.2624, the RANDOM-INIT baseline's dispersion, applied to a
    # pipeline whose real dispersion is 0. Together they demanded delta > +0.16 pp to clear a
    # -0.26 pp margin on a dataset PROTOCOL.md itself describes as saturated at 0.0000 pp.
    # Measured consequence: -0.4047 for H36 (whose mouse score IMPROVED, 92.90180243 ->
    # 92.91701410) and -0.4199 for P02 at delta exactly 0. It never once changed a verdict.
    #
    # The replacement (audit.noninferiority_ci) pools both arms and floors sigma at the DATASET's
    # own measurement resolution rather than at another algorithm's dispersion:
    #     sd_pooled = sqrt(((n_v-1)*s_v^2 + (n_c-1)*s_c^2) / (n_v+n_c-2))
    #     se        = max(sd_pooled, measurement_resolution_pp) * sqrt(1/n_v + 1/n_c)
    #     pass iff  delta - z*se > non_inferiority_pp
    # For a deterministic pipeline se collapses to ~0 and the test becomes the honest question
    # "is the point estimate above the margin?"; for a genuinely stochastic one it is the
    # ordinary pooled-variance non-inferiority test. Pinned by tests/test_audit_gates.py.
    se: pooled_floored_at_measurement_resolution
    require_non_inferiority: true
  evidence:
    # D5: audit.py used to WARN-and-continue on an empty comparator pool and still exit 0 with
    # an empty per_dataset. Verified live in audit_P02.json: 2 of 3 datasets produced NO
    # significance analysis whatsoever and the audit passed. A champion was promotable with
    # zero comparator evidence.
    require_comparator_runs: true
    require_variant_runs: true
    require_nonempty_per_dataset: true
  provenance:
    # D6 = CLAUDE.md invariant 5 ("results must be reproducible via git checkout + the logged
    # command") and CAMPAIGN.md rule 3, neither of which was enforced anywhere. Cheap test:
    # `git cat-file -e <commit>:<repo-relative path to the variant module>`. If the module does
    # not exist at the commit the runs were stamped with, the number cannot be reproduced by
    # checkout, whatever the working tree happened to contain. Skipped (WARN) if git is absent.
    require_variant_module_at_commit: true
    # A commit that DOES contain the module but was run from a modified tree is a softer
    # problem: reproducible in principle, unverifiable in fact. WARN, not FAIL.
    warn_on_dirty_tree: true

# ─────────────────────────────────────────────────────────────────────────────
# Budgets and stop/escalation criteria for unattended operation.
# ─────────────────────────────────────────────────────────────────────────────
budget:
  max_cycles: 200                     # hard backstop on total research cycles
  max_wall_clock_h_per_day: 12
  # Raised 6 -> 10 at the P01 re-baseline (2026-08-09), together with driver.sh CYCLE_TIMEOUT_S.
  # Measured here: a 3-seed screen is ~3.2 h and a confirm (5 seeds x 3 datasets) ~5.3 h, so a
  # cycle that reaches confirm needs ~8.5 h. At the old 6 h cap the driver would have killed every
  # such cycle mid-confirm — i.e. no variant could ever have been confirmed on this machine,
  # silently, forever. This is a consequence of microns taking 3214 s/run here vs 706 s on MPS.
  # KEPT at 10 h after P02 (2026-08-09). The 1-seed screen cuts a deterministic variant's screen
  # to ~1.1 h and a full confirming cycle to ~6.4 h, but this is a BACKSTOP, not a target: an
  # rng-classified variant still screens at 3 seeds (~8.5 h to confirm), so lowering the cap would
  # resume killing exactly the cycles P01 raised it to protect.
  max_cycle_wall_clock_h: 10          # a single cycle is killed past this
  min_free_disk_gb: 50                # driver refuses to start below this
  results_dir_max_gb: 20

escalation:
  # ── WHY THIS SECTION WAS REWRITTEN (2026-08-15) ────────────────────────────────────
  # Divergent mode - the campaign's only escape from incrementalism - had NEVER EXECUTED,
  # and could not have. It was gated on `consecutive_kills >= 3`, and after 7 cycles that
  # counter had never left 0. The reason is structural, not luck: 4 of the first 7 cycles
  # were INFRASTRUCTURE items (P01, P02, P05, P07), which by construction never increment a
  # kill counter, and the only two science items both passed. A campaign that produces no
  # kills can never trip a kill-counting trigger. Meanwhile `autoresearch/lit/` did not exist,
  # `cycles_since_literature_scan` sat at 5 against a threshold of 8, and queue item L01
  # (the literature scan itself) sat at priority 8, i.e. unreachable.
  #
  # So the trigger now counts what ACTUALLY HAPPENS: cycles that did not move the score.
  # On the real history that fires correctly - cycles 1, 2, 6 and 7 moved no champion, so the
  # campaign would have been forced to diverge at cycle 7 instead of proposing another
  # infrastructure item.
  # ───────────────────────────────────────────────────────────────────────────────────

  # Cycles since the last CHAMPION CHANGE on any dataset, before the campaign is FORCED out
  # of incremental mode. Counts every cycle - keep, kill, iterate, done, and no-op alike -
  # because the question this guards is "are we still making progress?", not "did this
  # particular hypothesis die?". A cycle that promotes a champion resets it to 0.
  divergent_after_k_cycles_without_score_move: 3

  # Kept as a SECOND, independent trigger rather than deleted: three genuine kills in a row
  # is still evidence that a design vein is exhausted, and it fires earlier than the counter
  # above when the campaign IS producing kills. Either condition is sufficient.
  divergent_after_k_kills: 3

  divergent_mode: >
    Stop proposing variants of the current design. Run a literature scan (scout), re-read the
    diagnosis (Q01/Q02) and findings, and attack a DIFFERENT level: problem reformulation,
    a different move class, a different decomposition, or an idea imported from an adjacent
    field. Write the reasoning to autoresearch/lit/ before proposing anything.
    An INFRASTRUCTURE item does not satisfy this. If the top of the queue is a P-item when
    divergent mode is active, take the highest-priority SCIENCE item instead and file the
    P-item's cost against the next cycle - otherwise the campaign answers "we have stopped
    making progress" with "let us improve our tooling", which is how the first seven cycles
    spent 4 of themselves on infrastructure.

  # Force a literature refresh at least this often regardless of outcomes. Lowered 8 -> 5:
  # at 8 the campaign would have needed to survive longer than its entire history to date
  # before reading anything external, and the mission target is a published result
  # (Vahidi 2025) reached by combinatorial means we have not enumerated.
  literature_scan_every_n_cycles: 5

  # If the queue has fewer than this many viable SCIENCE items (P-items do not count -
  # tooling debt is not a research agenda), ideate before running anything.
  min_queue_depth: 3

# ─────────────────────────────────────────────────────────────────────────────
# Reference points (facts, not targets to hardcode into any algorithm).
# NEVER let any of these numbers enter an optimizer, a loss, or a variant module.
# ─────────────────────────────────────────────────────────────────────────────
reference:
  connectome_total_weight: 41912141
  best_solution_score: 35463823       # data/best_solution -> 84.6147 pct (downloaded reference)
  best_solution_pct: 84.6147
  vahidi_2025_pct: 84.61              # arXiv:2506.13799, greedy + bounded-span insertion + SCC
  paper_rocket_plateau_pct: 82.87     # Bader et al. 2025
  paper_rocket_crane_pct: 84.60       # needs Gurobi MIP + ~20 days; out of scope

# MACHINE-SPECIFIC — every value in this block must be re-pointed when the campaign moves to
# another machine, together with campaign.sandbox_root above. See autoresearch/PORTING.md and
# queue item P01 (hardware re-baseline), which is a prerequisite for any cycle on new hardware.
environment:
  machine: "Windows 10 laptop, NVIDIA RTX 4060 Laptop GPU (CUDA), Git Bash"
  python: /c/ProgramData/anaconda3/envs/allen/python.exe
  claude_config_dir: default           # `claude /login` on this box writes to ~/.claude
  device: auto                        # MPS -> CUDA -> CPU; discrete score always on CPU
  # env.gpu string the harness stamps into every results/*.json on this box. audit.py and
  # update_sota.py count only runs carrying it, so the 265 MPS-measured records from the MacBook
  # can never be pooled into a mean or a sigma here. Clear it to pool every device.
  device_tag: "NVIDIA GeForce RTX 4060 Laptop GPU"
  torch: "2.8.0+cu128"
  python_version: "3.9.25"            # 3.9.23 on the MacBook; numpy/scipy/pandas pins unchanged
  shell: "Git Bash (MSYS2) — driver.sh and the guard hook run under it, not WSL"
