# Autonomous research campaign — configuration (Phase 7)
#
# This file is the ONLY place campaign-level knobs live. The cycle command, the driver and
# the audit script all read it. Editing it changes the campaign; editing anything else to
# change a threshold is a protocol violation.
#
# Governance: autoresearch/CAMPAIGN.md (constitution) + experiments/PROTOCOL.md (§ Phase-7).

campaign:
  name: phase7-autonomous
  branch: auto/campaign
  sandbox_root: D:/1/bot/UHaifa/deep_learning/mfas_autoresearch
  # Everything below this path is writable by the campaign. Nothing above it ever is.
  repo_subdir: nn_backward_connections

# ─────────────────────────────────────────────────────────────────────────────
# Objective — ordered phases. Phase 2 does not start until Phase 1 exits.
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - id: quality
    active: true
    goal: >
      Push the exact feedforward % on the fly connectome from the current champion (83.9101%,
      H35) to at least the known-reachable reference 84.6147%, then beyond it, without
      regressing microns or mouse. Runtime is a CONSTRAINT here, not an objective.
    exit_criteria:
      # ALL must hold, verified by the verifier + critic + autoresearch/audit.py.
      - "connectome champion >= 84.6147 pct (CONFIRM stage, 95% CI lower bound > 0 vs prior champion)"
      - "microns champion non-regressing vs its current champion (CI lower bound > -0.002 pp)"
      - "mouse non-inferior (CI lower bound > -0.26 pp)"
      - "champion reproduces from a clean checkout on >= 5 seeds"
      - "autoresearch/audit.py returns exit code 0 on the champion's evidence"
  - id: speed
    active: false
    goal: >
      At the quality level fixed by Phase 1 (no score regression beyond its noise floor),
      minimize wall-clock per run. Headline metric becomes the (score, wall_clock) Pareto front
      plus score@60s / score@300s anytime curves.
    exit_criteria:
      - "connectome: same champion score within noise at <= 0.5x the Phase-1 champion wall-clock"
      - "anytime curves logged for the champion and the prior champion on all three datasets"

# ─────────────────────────────────────────────────────────────────────────────
# Hard runtime constraint (Phase 1). A variant that cannot produce a scored run within
# this wall-clock per (dataset, seed) is out of scope — it is not a usable algorithm.
# ─────────────────────────────────────────────────────────────────────────────
runtime:
  max_wall_clock_s_per_run: 3600      # user-set: "quality first, but within about an hour"
  # Soft warning band — the cycle should flag (not kill) a variant crossing this.
  # Raised 1200 -> 3400 at the P01 re-baseline: the CHAMPION itself now takes 3214 s on microns
  # (706 s on MPS, 4.55x), so a 1200 s band would fire on every single microns run and train the
  # cycle to ignore the warning. At 3400 it means what it is supposed to mean: this run is
  # approaching the 3600 s hard cap. Connectome runs (591 s) are nowhere near either number.
  warn_wall_clock_s_per_run: 3400
  # Only ONE heavy training/refinement process at a time: single GPU (RTX 4060, 8 GB).
  max_concurrent_heavy_runs: 1

# ─────────────────────────────────────────────────────────────────────────────
# Datasets — character and per-dataset gates. Extends PROTOCOL.md § Phase-5.
# ─────────────────────────────────────────────────────────────────────────────
datasets:
  connectome:
    role: primary
    n_nodes: 136648
    baseline_sigma_pp: 0.0189         # frozen-baseline noise floor (PROTOCOL.md)
    # KEPT at the MPS-era value, but its JUSTIFICATION changed at the P01 re-baseline.
    # It used to be 2 x champion sigma (H35 sigma = 0.0060 on MPS). On CUDA the champion's sigma
    # is exactly 0.0000 — the pipeline never draws from `seed` — so "2 x sigma" would be 0 and
    # would wave through a +0.0001 pp difference. Read this now as a MINIMUM EFFECT SIZE: a gain
    # smaller than this is not worth a champion change, whatever its CI says. It is 1.7% of the
    # 0.70 pp mission gap, so it does not stand in the way of a real result.
    screen_delta_pp: 0.012
    confirm_seeds: [42, 123, 999, 7, 31415]
    screen_seeds: [42, 123, 999]
  microns:
    role: primary
    n_nodes: 67534
    baseline_sigma_pp: 0.0006
    # Same re-justification as connectome: champion sigma is 0.0000 here, so this is a minimum
    # effect size, not 2 x sigma. Note microns is the expensive dataset on this hardware
    # (3240 s/run vs 706 s on MPS) — see runtime above and queue item P02.
    screen_delta_pp: 0.002
    confirm_seeds: [42, 123, 999, 7, 31415]
    screen_seeds: [42, 123, 999]
  mouse:
    role: supporting                  # non-inferiority only; tiny and 14x noisier
    n_nodes: 148
    baseline_sigma_pp: 0.2624
    non_inferiority_pp: -0.26
    confirm_seeds: [42, 123, 999, 7, 31415, 2718, 1618, 1414, 1732, 2236,
                    9999, 8888, 7777, 6666, 5555, 4444, 3333, 2222, 1111, 1234]
    screen_seeds: [42, 123, 999]

# ─────────────────────────────────────────────────────────────────────────────
# Seed policy — how many screen seeds a variant actually needs (P02, 2026-08-09).
# Full rationale and the four safety constraints: PROTOCOL.md § Phase-7.4.
#
# The champion pipelines take a `seed` and never draw from it (init_positions comes from
# deterministic greedy-FAS, so make_init_positions is never reached), and this device reproduces
# a repeated seed bit-identically. For such a variant, screening at 42/123/999 runs the same
# computation three times — 108 min of pure waste per microns screen.
# ─────────────────────────────────────────────────────────────────────────────
seed_policy:
  enabled: true
  # The classifier is the authority. Static call-graph walk from the variant's run();
  # fail-safe (unresolvable call -> "rng"); pinned by tests/test_seed_class.py.
  classifier: autoresearch/seed_class.py
  classification_cache: autoresearch/seed_class.json   # regenerate: --all --out <this>
  screen_seeds_by_class:
    deterministic:
      # Primaries drop to one seed; mouse never does — see standing_tripwire below.
      connectome: [42]
      microns: [42]
      mouse: [42, 123, 999]
    rng:
      connectome: [42, 123, 999]
      microns: [42, 123, 999]
      mouse: [42, 123, 999]
  # Mouse costs ~6 s/run, so 3 seeds there are free and act as the corroborating probe.
  # If they are NOT identical for a variant the classifier called deterministic, the
  # classification is falsified: the 1-seed primary numbers are VOID and the variant is
  # re-screened at 3 seeds. The probe may escalate; it may never de-escalate.
  standing_tripwire: mouse_3_seeds_must_agree_for_deterministic
  # Confirm is deliberately untouched. Re-running a deterministic variant at 5 seeds is not
  # information-free: it re-establishes DEVICE repeatability, the only variance source left.
  # It is also what guarantees no CI in a promotion path is computed on a 1-seed pool, where
  # audit.protocol_se() (comparator-only, sqrt(2/n_c)) would understate the SE by ~41%.
  confirm_seeds_unchanged: true
  # Device determinism is a PRECONDITION and a property of the hardware, not the code.
  # Re-establish it on every port: autoresearch/PORTING.md § 6b. If it fails -> stay at 3 seeds.
  device_determinism_verified:
    # Same seed, fresh process, hours apart: position vectors compared bit-for-bit, 0 entries
    # differing. This is a property of the DEVICE and must be re-established on every port.
    connectome: true      # H35 s42 implement vs verify, bit-identical (P02)
    microns: true         # H30 s42 implement vs verify, bit-identical (P02)
    evidence: experiments/outputs/proto_P02_primaries.json

# ─────────────────────────────────────────────────────────────────────────────
# Comparator policy — Phase-7 change vs Phase 3-6.
# Variants are now judged against the CURRENT CHAMPION (autoresearch/sota.json), not the
# original random-init baseline. Beating a superseded baseline is not progress.
# ─────────────────────────────────────────────────────────────────────────────
comparator:
  primary: champion                   # per-dataset, from autoresearch/sota.json
  also_report: [baseline_passthrough, H02]   # kept for continuity with findings.md
  budget_basis: total_grad_steps      # unchanged; wall_clock_s logged alongside

# ─────────────────────────────────────────────────────────────────────────────
# The cheap-first gate ladder. A hypothesis climbs; it never skips a rung.
# This is what kept Phase 6 cheap (H32/H33/H34 died on rung 1 for ~0 large-graph compute).
# ─────────────────────────────────────────────────────────────────────────────
gates:
  - id: novelty
    what: >
      Is the mechanism materially distinct from every entry in autoresearch/killed.json?
      If it shares an axis with a killed entry, the proposal MUST state which revival
      condition it satisfies. No revival condition -> drop without spending compute.
  - id: prototype
    what: >
      Cheap proxies only (mouse + gap.make_hard_synthetic_graph + optionally an SCC subgraph).
      Must beat the champion pipeline's proxy score, or show a mechanism-specific signal that
      the proxy is known to under-represent. Budget: minutes, CPU.
  - id: screen
    what: >
      Real harness, role=implement, 3 datasets, vs champion. Seed count per dataset comes from
      seed_policy below, NOT from a fixed 3: run `python autoresearch/seed_class.py --variant
      <id>` first and record the verdict in the log entry.
      Pass iff delta > screen_delta_pp on BOTH primaries and mouse non-inferior.
  - id: confirm
    what: >
      Independent re-run by the verifier: confirm_seeds per dataset, role=confirm.
      Pass iff Welch 95% CI lower bound > 0 on BOTH primaries and mouse non-inferior.
      ON THIS MACHINE THE WELCH CI IS NOT SUFFICIENT ON ITS OWN. These pipelines take a
      seed but never draw from it (init_positions comes from deterministic greedy-FAS), so
      seed spread only ever measured device non-determinism; CUDA reproduces bit-identically
      and std collapses to 0, which makes SE 0 and any positive delta "significant". Use the
      PROTOCOL CI lower bound (audit.py floors its sigma at baseline_sigma_pp) AND require
      delta > screen_delta_pp. Verified in P01, 2026-08-09; see experiments/log.md.
  - id: critic
    what: >
      Red-team + mechanical audit (autoresearch/audit.py). Leakage, frozen integrity,
      fabricated numbers, cherry-picked seeds, double-counted increments, runtime honesty.

# ─────────────────────────────────────────────────────────────────────────────
# Budgets and stop/escalation criteria for unattended operation.
# ─────────────────────────────────────────────────────────────────────────────
budget:
  max_cycles: 200                     # hard backstop on total research cycles
  max_wall_clock_h_per_day: 12
  # Raised 6 -> 10 at the P01 re-baseline (2026-08-09), together with driver.sh CYCLE_TIMEOUT_S.
  # Measured here: a 3-seed screen is ~3.2 h and a confirm (5 seeds x 3 datasets) ~5.3 h, so a
  # cycle that reaches confirm needs ~8.5 h. At the old 6 h cap the driver would have killed every
  # such cycle mid-confirm — i.e. no variant could ever have been confirmed on this machine,
  # silently, forever. This is a consequence of microns taking 3214 s/run here vs 706 s on MPS.
  # KEPT at 10 h after P02 (2026-08-09). The 1-seed screen cuts a deterministic variant's screen
  # to ~1.1 h and a full confirming cycle to ~6.4 h, but this is a BACKSTOP, not a target: an
  # rng-classified variant still screens at 3 seeds (~8.5 h to confirm), so lowering the cap would
  # resume killing exactly the cycles P01 raised it to protect.
  max_cycle_wall_clock_h: 10          # a single cycle is killed past this
  min_free_disk_gb: 50                # driver refuses to start below this
  results_dir_max_gb: 20

escalation:
  # Consecutive kills before the campaign is FORCED out of incremental mode.
  divergent_after_k_kills: 3
  divergent_mode: >
    Stop proposing variants of the current design. Run a literature scan (scout), re-read the
    diagnosis (Q01/Q02) and findings, and attack a DIFFERENT level: problem reformulation,
    a different move class, a different decomposition, or an idea imported from an adjacent
    field. Write the reasoning to autoresearch/lit/ before proposing anything.
  # Force a literature refresh at least this often regardless of outcomes.
  literature_scan_every_n_cycles: 8
  # If the queue has fewer than this many viable items, ideate before running anything.
  min_queue_depth: 3

# ─────────────────────────────────────────────────────────────────────────────
# Reference points (facts, not targets to hardcode into any algorithm).
# NEVER let any of these numbers enter an optimizer, a loss, or a variant module.
# ─────────────────────────────────────────────────────────────────────────────
reference:
  connectome_total_weight: 41912141
  best_solution_score: 35463823       # data/best_solution -> 84.6147 pct (downloaded reference)
  best_solution_pct: 84.6147
  vahidi_2025_pct: 84.61              # arXiv:2506.13799, greedy + bounded-span insertion + SCC
  paper_rocket_plateau_pct: 82.87     # Bader et al. 2025
  paper_rocket_crane_pct: 84.60       # needs Gurobi MIP + ~20 days; out of scope

# MACHINE-SPECIFIC — every value in this block must be re-pointed when the campaign moves to
# another machine, together with campaign.sandbox_root above. See autoresearch/PORTING.md and
# queue item P01 (hardware re-baseline), which is a prerequisite for any cycle on new hardware.
environment:
  machine: "Windows 10 laptop, NVIDIA RTX 4060 Laptop GPU (CUDA), Git Bash"
  python: /c/ProgramData/anaconda3/envs/allen/python.exe
  claude_config_dir: default           # `claude /login` on this box writes to ~/.claude
  device: auto                        # MPS -> CUDA -> CPU; discrete score always on CPU
  # env.gpu string the harness stamps into every results/*.json on this box. audit.py and
  # update_sota.py count only runs carrying it, so the 265 MPS-measured records from the MacBook
  # can never be pooled into a mean or a sigma here. Clear it to pool every device.
  device_tag: "NVIDIA GeForce RTX 4060 Laptop GPU"
  torch: "2.8.0+cu128"
  python_version: "3.9.25"            # 3.9.23 on the MacBook; numpy/scipy/pandas pins unchanged
  shell: "Git Bash (MSYS2) — driver.sh and the guard hook run under it, not WSL"
